name: CI

# Typecheck + tests on every branch push and PR. Tag pushes are intentionally
# excluded (the `branches` filter never matches a tag) — releases run their own
# gated checks in release.yml.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `prepare` builds dist/ on install, so this also proves the build.
      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # The committed OpenAPI snapshot (website/src/openapi.json, issue #74)
      # must match the live zod route schemas: regenerate it and fail if it
      # drifted. The docs deploy regenerates it anyway, so the live site is
      # never stale — this keeps the in-repo snapshot that offline `dev` reads
      # honest after a route-schema change.
      - run: npm run docs:openapi
      - name: Fail if the OpenAPI snapshot is stale (run `npm run docs:openapi`)
        run: git diff --exit-code website/src/openapi.json
