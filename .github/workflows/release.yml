name: Release

# Publish to npm when a semver tag (vX.Y.Z, optionally -prerelease) is pushed.
# The tag drives the version — no version bump commit is needed in the repo.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  id-token: write # npm provenance (public package, GitHub OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Installs deps and, via `prepare`, builds dist/ (server + SPA).
      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # Derive the version from the tag: refs/tags/v1.2.3 -> 1.2.3. A prerelease
      # (has a hyphen, e.g. 1.2.3-beta.1) publishes under the `next` dist-tag so
      # it never moves `latest`.
      - name: Stamp version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "npm_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION to dist-tag '$TAG'"

      - name: Publish to npm
        run: npm publish --provenance --tag "${{ steps.ver.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
