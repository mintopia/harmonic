name: Release

# release-please owns versioning and the changelog. On every push to main it
# maintains a release PR that bumps package.json + CHANGELOG.md from the
# Conventional Commits landed since the last release (feat -> minor, fix ->
# patch, ! / BREAKING CHANGE -> major). Merging that PR tags vX.Y.Z, cuts a
# GitHub Release, and the gated `publish` job below pushes the package to npm
# via Trusted Publishing (OIDC) — no NPM_TOKEN, provenance attached.
#
# The publish runs in this same workflow run (a job dependency), so it does NOT
# rely on the release-please tag re-triggering a separate workflow — a tag
# pushed with GITHUB_TOKEN would not fire one. npm's trusted publisher is bound
# to this file's name (release.yml) + repo (mintopia/harmonic): renaming this
# file, or moving the publish step elsewhere, breaks publishing until the
# trusted publisher is reconfigured on npmjs.com.
#
# The `back-merge` job then returns the release commit (version bump + CHANGELOG)
# from main to develop, closing the Gitflow gap where main diverges every
# release. It opens an auto-merging main -> develop PR, falling back to a direct
# merge push only when the repo can't auto-merge.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # Gitflow: work accrues on develop; releases are cut from main.
          # Without this, release-please defaults to the repo default branch
          # (develop) and its release PR only recomputes on a main push, so it
          # goes stale between releases. Owning main aligns the release PR,
          # the tag, and the publish on the branch we release from.
          target-branch: main

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Installs deps and, via `prepare`, builds dist/ (server + SPA).
      - run: npm ci

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest

      - run: npm run typecheck
      - run: npm test

      # release-please already stamped package.json. Publish a prerelease
      # (version has a hyphen) under `next` so it never moves `latest`.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "Publishing $VERSION to dist-tag '$TAG'"
          npm publish --tag "$TAG"

  back-merge:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the direct-merge fallback to develop
      pull-requests: write # open + auto-merge the back-merge PR
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Back-merge the release into develop
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch origin main develop
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main — nothing to back-merge."
            exit 0
          fi

          title="chore: back-merge ${TAG} into develop"
          body="Gitflow back-merge: returns the release bump and CHANGELOG from \`main\` to \`develop\`."

          existing=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')
          created=""
          if [ -n "$existing" ]; then
            pr="$existing"
          else
            pr=$(gh pr create --base develop --head main --title "$title" --body "$body" 2>/tmp/pr.err) && created=1 || pr=""
          fi

          if [ -n "$pr" ] && gh pr merge "$pr" --auto --merge; then
            echo "Back-merge PR $pr will merge once it is mergeable."
            exit 0
          fi

          echo "PR back-merge did not complete; using the direct-merge fallback."
          if [ -s /tmp/pr.err ]; then cat /tmp/pr.err; fi
          if [ -n "$created" ]; then gh pr close "$pr" --comment "Superseded by a direct back-merge from CI." || true; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout develop
          git merge --no-ff origin/main -m "$title"
          git push origin develop
