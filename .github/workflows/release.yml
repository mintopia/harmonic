name: Release

# release-please owns versioning and the changelog. On every push to main it
# maintains a release PR that bumps package.json + CHANGELOG.md from the
# Conventional Commits landed since the last release (feat -> minor, fix ->
# patch, ! / BREAKING CHANGE -> major). Merging that PR tags vX.Y.Z, cuts a
# GitHub Release, and the gated `publish` job below pushes the package to npm
# via Trusted Publishing (OIDC) — no NPM_TOKEN, provenance attached.
#
# The publish runs in this same workflow run (a job dependency), so it does NOT
# rely on the release-please tag re-triggering a separate workflow — a tag
# pushed with GITHUB_TOKEN would not fire one. npm's trusted publisher is bound
# to this file's name (release.yml) + repo (mintopia/harmonic): renaming this
# file, or moving the publish step elsewhere, breaks publishing until the
# trusted publisher is reconfigured on npmjs.com.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Installs deps and, via `prepare`, builds dist/ (server + SPA).
      - run: npm ci

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest

      - run: npm run typecheck
      - run: npm test

      # release-please already stamped package.json. Publish a prerelease
      # (version has a hyphen) under `next` so it never moves `latest`.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "Publishing $VERSION to dist-tag '$TAG'"
          npm publish --tag "$TAG"
