name: Release

# Publish to npm when a semver tag (vX.Y.Z, optionally -prerelease) is pushed.
# The tag drives the version — no version bump commit is needed in the repo.
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN secret. The package's
# trusted publisher must be configured on npmjs.com to this repo + workflow
# (Settings -> Trusted Publisher -> GitHub Actions: mintopia/harmonic,
# workflow release.yml). Provenance is generated automatically.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  id-token: write # OIDC token for Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Installs deps and, via `prepare`, builds dist/ (server + SPA).
      - run: npm ci

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest

      - run: npm run typecheck
      - run: npm test

      # Derive the version from the tag: refs/tags/v1.2.3 -> 1.2.3. A prerelease
      # (has a hyphen, e.g. 1.2.3-beta.1) publishes under the `next` dist-tag so
      # it never moves `latest`.
      - name: Stamp version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "npm_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION to dist-tag '$TAG'"

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # publish credential, and attaches provenance automatically.
      - name: Publish to npm
        run: npm publish --tag "${{ steps.ver.outputs.npm_tag }}"
