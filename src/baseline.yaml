    tokens: null
    costUsd: null
  progress: false
  toolTimeoutMinutes: 20
  promptInactivityTimeoutMinutes: 15
archive:
  retain:
    days: null
    maxTotalMB: null
export:
  enabled: false
  includeStates: [done, cancelled, deleted]
  directory:
    path: null
  s3:
    endpoint: null
    region: null
    bucket: null
    prefix: ""
    forcePathStyle: false
    accessKeyId: null
    secretAccessKey: null
  redact:
    patterns: []
