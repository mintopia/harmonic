name: ""
harnesses:
  claude:
    command: npx
    args: [--yes, "@agentclientprotocol/claude-agent-acp"]
    env: {}
    models:
      - { id: claude-opus-5, price: { input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25 }, contextWindow: 1000000 }
      - { id: claude-fable-5, price: { input: 10, output: 50, cacheRead: 1, cacheWrite: 12.5 }, contextWindow: 1000000 }
      - { id: claude-sonnet-5, price: { input: 3, output: 15, cacheRead: 0.3, cacheWrite: 3.75 }, contextWindow: 1000000 }
      - { id: claude-opus-4-8, price: { input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25 }, contextWindow: 1000000 }
      - { id: claude-haiku-4-5, price: { input: 1, output: 5, cacheRead: 0.1, cacheWrite: 1.25 }, contextWindow: 200000 }
    defaultModel: claude-sonnet-5
    cacheWarmSeconds: 3600
  codex:
    command: npx
    args: [--yes, "@agentclientprotocol/codex-acp"]
    env: {}
    models:
      - { id: gpt-5.6-sol, price: { input: 5, output: 30, cacheRead: 0.5, cacheWrite: 6.25 }, contextWindow: 400000 }
      - { id: gpt-5.6-terra, price: { input: 2.5, output: 15, cacheRead: 0.25, cacheWrite: 3.125 }, contextWindow: 400000 }
      - { id: gpt-5.6-luna, price: { input: 1, output: 6, cacheRead: 0.1, cacheWrite: 1.25 }, contextWindow: 400000 }
      - { id: gpt-5.5, price: { input: 5, output: 30, cacheRead: 0.5, cacheWrite: 0 }, contextWindow: 1050000 }
      - { id: gpt-5.4, price: { input: 2.5, output: 15, cacheRead: 0.25, cacheWrite: 0 }, contextWindow: 1050000 }
      - { id: gpt-5.4-mini, price: { input: 0.75, output: 4.5, cacheRead: 0.075, cacheWrite: 0 }, contextWindow: 400000 }
      - { id: gpt-5-mini, price: { input: 0.25, output: 2, cacheRead: 0.025, cacheWrite: 0 }, contextWindow: 400000 }
    defaultModel: gpt-5.6-sol
    cacheWarmSeconds: 300
  copilot:
    command: copilot
    args: [--acp, --disable-builtin-mcps]
    env: {}
    models:
      - { id: auto }
      - { id: claude-sonnet-5, price: { input: 3, output: 15, cacheRead: 0.3, cacheWrite: 3.75 }, contextWindow: 1000000 }
      - { id: claude-sonnet-4.6, price: { input: 3, output: 15, cacheRead: 0.3, cacheWrite: 3.75 }, contextWindow: 1000000 }
      - { id: claude-sonnet-4.5, price: { input: 3, output: 15, cacheRead: 0.3, cacheWrite: 3.75 }, contextWindow: 200000 }
      - { id: claude-haiku-4.5, price: { input: 1, output: 5, cacheRead: 0.1, cacheWrite: 1.25 }, contextWindow: 200000 }
      - { id: claude-opus-4.8, price: { input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25 }, contextWindow: 1000000 }
      - { id: claude-opus-4.7, price: { input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25 }, contextWindow: 1000000 }
      - { id: claude-opus-4.6, price: { input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25 }, contextWindow: 1000000 }
      - { id: claude-opus-4.5, price: { input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25 }, contextWindow: 200000 }
      - { id: gpt-5.5, price: { input: 5, output: 30, cacheRead: 0.5, cacheWrite: 0 }, contextWindow: 1050000 }
      - { id: gpt-5.4, price: { input: 2.5, output: 15, cacheRead: 0.25, cacheWrite: 0 }, contextWindow: 1050000 }
      - { id: gpt-5.3-codex, price: { input: 1.25, output: 10, cacheRead: 0.125, cacheWrite: 0 }, contextWindow: 400000 }
      - { id: gpt-5.4-mini, price: { input: 0.75, output: 4.5, cacheRead: 0.075, cacheWrite: 0 }, contextWindow: 400000 }
      - { id: gpt-5-mini, price: { input: 0.25, output: 2, cacheRead: 0.025, cacheWrite: 0 }, contextWindow: 400000 }
      - { id: gpt-5.6-luna, price: { input: 1, output: 6, cacheRead: 0.1, cacheWrite: 1.25 }, contextWindow: 400000 }
      - { id: gpt-5.6-terra, price: { input: 2.5, output: 15, cacheRead: 0.25, cacheWrite: 3.125 }, contextWindow: 400000 }
    defaultModel: auto
    cacheWarmSeconds: 300
defaults:
  harness: claude
  workingDir: $CWD
  isolationMode: direct
  priority: normal
  conflictResolveTurns: 2
chat:
  harness: claude
  model: claude-sonnet-5
autoRunner:
  enabled: false
  maxConcurrentAttempts: 1
maxAttempts: 2
contextReuseTokenLimit: 200000
drive:
  prompt: "{skill}\n\nResolve tracker issue #{ref} ({url}) autonomously, end to end — read the issue yourself for the details. Work only on the branch you start on; Harmonic owns branching and closes the ticket once it verifies your work, so don't create branches or close the ticket yourself. When the work is done, comment a summary on the issue and call `finish_task`."
  unattendedReminder: "## Running unattended\n\nYou are Harmonic Task {taskId} — no human is watching this turn. Ending a turn is a checkpoint, not a handoff, and Harmonic re-prompts you only a limited number of times, so don't idle-wait on background work (CI, watchers) or input. Keep working until the task is genuinely done, then call `finish_task` (taskId={taskId}). If you're blocked on a decision only a human can make, call `escalate_task` (taskId={taskId}) with a reason instead of guessing or waiting."
  continuePrompt: "Your last turn ended but Task {taskId} isn't finished — you haven't called `finish_task`. Pick the work back up and drive it to completion now; don't idle-wait, then call `finish_task` when it's done."
  mergeFate: auto-merge
  continueAttempts: 10
taskPrompt: "{prompt}"
conversationIdleTimeoutMinutes: 30
verify:
  commands: []
  review:
    enabled: false
merge:
  postMergeCheck: true
guardrails:
  budget:
    wallClockMinutes: 60
    tokens: null
    costUsd: null
  progress: false
  toolTimeoutMinutes: 20
  promptInactivityTimeoutMinutes: 15
